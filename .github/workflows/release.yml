name: Release

# Publica uma release no GitHub com o instalador ao enviar uma tag de versão:
#   npm version patch   (ou minor/major: atualiza o package.json e cria a tag vX.Y.Z)
#   git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão da tag
        shell: bash
        run: |
          versao=$(node -p "require('./package.json').version")
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json (v$versao)."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Lint e testes
        run: npm run check

      - name: Compilar ponte de sensores
        run: npm run build:bridge

      - name: Gerar instalador
        run: npm run dist -- --publish never

      - name: Extrair notas do CHANGELOG
        shell: bash
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v h="## [$versao]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::O CHANGELOG.md não tem a seção [$versao]."
            exit 1
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          name: PC Sentinel ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/PC-Sentinel-Setup.exe
            release/PC-Sentinel-Setup.exe.blockmap
            release/latest.yml
