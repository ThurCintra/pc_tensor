name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows: o app depende de taskkill, powercfg e netsh (simulados nos testes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build da interface
        run: npm run build

  service:
    # Serviço nativo .NET 10 (service/): compila tratando avisos como erros e roda os testes dos cálculos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Testes do serviço
        run: dotnet test service/PcSentinel.sln

  cloud:
    # pc_tensor Cloud (cloud/): tipos dos quatro pacotes e testes com PostgreSQL em memória (PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos e testes
        run: npm run check

      - name: Build do site
        run: npm run build -w @pc-tensor/web
