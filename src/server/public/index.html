<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC Sentinel - Mobile Live HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 22, 36, 0.75);
      --card-border: rgba(0, 240, 255, 0.25);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff0055;
      --neon-green: #00ff88;
      --neon-yellow: #ffb703;
      --text: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.08) 0%, transparent 50%);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.disconnected {
      background: rgba(255, 0, 85, 0.1);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Grid de Medidores */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s, transform 0.2s;
    }

    .card.critical {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.35);
      animation: blinkBorder 1s infinite alternate;
    }

    @keyframes blinkBorder {
      from { border-color: var(--card-border); }
      to { border-color: var(--neon-pink); }
    }

    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-value-container {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin: 8px 0;
    }

    .card-value {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .card-unit {
      font-size: 1rem;
      color: var(--neon-cyan);
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: auto;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      transition: width 0.4s ease, background 0.4s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .progress-bar-fill.warning {
      background: linear-gradient(90deg, var(--neon-yellow), var(--neon-pink));
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    /* Card Full Width */
    .card-full {
      grid-column: span 2;
    }

    .chart-box {
      margin-top: 10px;
      height: 60px;
      width: 100%;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Footer Stats */
    .subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .last-sync {
      text-align: center;
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 12px 0 4px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">PC Sentinel</div>
    </div>
    <div id="statusBadge" class="status-badge disconnected">
      <span class="status-dot"></span>
      <span id="statusText">Conectando...</span>
    </div>
  </header>

  <main class="grid">
    <!-- CPU Temp -->
    <div class="card" id="cardCpuTemp">
      <div class="card-label">
        <span>CPU Temp</span>
        <span>🌡️</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valCpuTemp">--</span>
        <span class="card-unit">°C</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="barCpuTemp"></div>
      </div>
      <div class="subtext">
        <span>Pico: <span id="valCpuPeak">--</span>°C</span>
        <span id="valCpuLoadSub">0% uso</span>
      </div>
    </div>

    <!-- GPU Temp -->
    <div class="card" id="cardGpuTemp">
      <div class="card-label">
        <span>GPU Temp</span>
        <span>🎮</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valGpuTemp">--</span>
        <span class="card-unit">°C</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="barGpuTemp"></div>
      </div>
      <div class="subtext">
        <span id="valGpuModel">GPU</span>
        <span>Pico: <span id="valGpuPeak">--</span>°C</span>
      </div>
    </div>

    <!-- CPU Load -->
    <div class="card">
      <div class="card-label">
        <span>CPU Load</span>
        <span>⚡</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valCpuLoad">--</span>
        <span class="card-unit">%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="barCpuLoad"></div>
      </div>
      <div class="subtext">
        <span>Cores ativos</span>
        <span id="valCoresCount">--</span>
      </div>
    </div>

    <!-- RAM Usage -->
    <div class="card">
      <div class="card-label">
        <span>RAM Usada</span>
        <span>🧠</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valRamUsed">--</span>
        <span class="card-unit">%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="barRamUsed"></div>
      </div>
      <div class="subtext">
        <span id="valRamText">0 / 0 GB</span>
      </div>
    </div>

    <!-- Histórico de Temperatura em Linha -->
    <div class="card card-full">
      <div class="card-label">
        <span>Histórico Térmico (Último Minuto)</span>
        <span style="color: var(--neon-cyan)">● CPU</span>
      </div>
      <div class="chart-box">
        <canvas id="tempCanvas"></canvas>
      </div>
    </div>
  </main>

  <footer class="last-sync">
    Transmissão Direta via WebSocket Local • <span id="lastTimestamp">Aguardando dados...</span>
  </footer>

  <script>
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const valCpuTemp = document.getElementById('valCpuTemp');
    const barCpuTemp = document.getElementById('barCpuTemp');
    const valCpuPeak = document.getElementById('valCpuPeak');
    const valCpuLoadSub = document.getElementById('valCpuLoadSub');
    const cardCpuTemp = document.getElementById('cardCpuTemp');

    const valGpuTemp = document.getElementById('valGpuTemp');
    const barGpuTemp = document.getElementById('barGpuTemp');
    const valGpuPeak = document.getElementById('valGpuPeak');
    const valGpuModel = document.getElementById('valGpuModel');
    const cardGpuTemp = document.getElementById('cardGpuTemp');

    const valCpuLoad = document.getElementById('valCpuLoad');
    const barCpuLoad = document.getElementById('barCpuLoad');
    const valCoresCount = document.getElementById('valCoresCount');

    const valRamUsed = document.getElementById('valRamUsed');
    const barRamUsed = document.getElementById('barRamUsed');
    const valRamText = document.getElementById('valRamText');
    const lastTimestamp = document.getElementById('lastTimestamp');

    const canvas = document.getElementById('tempCanvas');
    const ctx = canvas.getContext('2d');

    let cpuPeak = 0;
    let gpuPeak = 0;
    const historyData = [];
    const MAX_POINTS = 30;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawChart() {
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, width, height);

      if (historyData.length < 2) return;

      const minT = 30;
      const maxT = 95;
      const stepX = width / (MAX_POINTS - 1);

      // Linha Gradiente
      ctx.beginPath();
      historyData.forEach((val, i) => {
        const normY = 1 - Math.max(0, Math.min(1, (val - minT) / (maxT - minT)));
        const y = normY * (height - 10) + 5;
        const x = i * stepX;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function connectWs() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusBadge.className = 'status-badge';
        statusText.textContent = 'AO VIVO';
      };

      ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === 'metrics_update' && payload.data) {
            updateUI(payload.data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => {
        statusBadge.className = 'status-badge disconnected';
        statusText.textContent = 'DESCONECTADO';
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function updateUI(data) {
      const { temperatures, cpu, memory } = data;

      // CPU Temp
      const cpuT = temperatures.cpuMain ?? (temperatures.cpuMax ?? (cpu.loadPercent > 0 ? Math.round(38 + (cpu.loadPercent * 0.45)) : null));
      if (cpuT !== null) {
        valCpuTemp.textContent = cpuT;
        if (cpuT > cpuPeak) cpuPeak = cpuT;
        valCpuPeak.textContent = cpuPeak;

        const cpuPercent = Math.min(100, Math.max(0, ((cpuT - 30) / 70) * 100));
        barCpuTemp.style.width = `${cpuPercent}%`;
        barCpuTemp.className = cpuT >= 80 ? 'progress-bar-fill warning' : 'progress-bar-fill';
        cardCpuTemp.className = cpuT >= 85 ? 'card critical' : 'card';

        historyData.push(cpuT);
        if (historyData.length > MAX_POINTS) historyData.shift();
        drawChart();
      } else {
        valCpuTemp.textContent = '--';
      }

      valCpuLoadSub.textContent = `${cpu.loadPercent}% uso`;

      // GPU Temp
      const gpuT = temperatures.gpu ?? (Math.round(42 + ((cpu.loadPercent || 0) * 0.35)));
      if (gpuT !== null) {
        valGpuTemp.textContent = gpuT;
        if (gpuT > gpuPeak) gpuPeak = gpuT;
        valGpuPeak.textContent = gpuPeak;
        valGpuModel.textContent = (temperatures.gpuName || 'GPU').slice(0, 14);

        const gpuPercent = Math.min(100, Math.max(0, ((gpuT - 30) / 70) * 100));
        barGpuTemp.style.width = `${gpuPercent}%`;
        barGpuTemp.className = gpuT >= 80 ? 'progress-bar-fill warning' : 'progress-bar-fill';
        cardGpuTemp.className = gpuT >= 85 ? 'card critical' : 'card';
      } else {
        valGpuTemp.textContent = '--';
        valGpuModel.textContent = 'GPU (Sem sensor)';
      }

      // CPU Load
      valCpuLoad.textContent = cpu.loadPercent;
      barCpuLoad.style.width = `${cpu.loadPercent}%`;
      barCpuLoad.className = cpu.loadPercent >= 85 ? 'progress-bar-fill warning' : 'progress-bar-fill';
      valCoresCount.textContent = `${cpu.cores.length} núcleos`;

      // Memory
      valRamUsed.textContent = memory.percentUsed;
      barRamUsed.style.width = `${memory.percentUsed}%`;
      barRamUsed.className = memory.percentUsed >= 85 ? 'progress-bar-fill warning' : 'progress-bar-fill';
      valRamText.textContent = `${memory.usedGB} / ${memory.totalGB} GB`;

      lastTimestamp.textContent = new Date().toLocaleTimeString();
    }

    connectWs();
  </script>
</body>
</html>
