<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC Sentinel - Dark Cyber-Clean Mobile HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0B0F19;
      --bg-canvas: #0D1117;
      --bg-card: rgba(17, 24, 39, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-radius-card: 14px;

      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;

      --status-stable-cyan: #00F0FF;
      --status-stable-emerald: #10B981;
      --status-warning: #FF8A00;
      --status-critical: #FF2A54;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-app);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(255, 42, 84, 0.05) 0%, transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00F0FF, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      color: #0B0F19;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #F3F4F6;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.3s;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10B981;
    }

    .status-badge.disconnected {
      background: rgba(255, 42, 84, 0.1);
      border-color: rgba(255, 42, 84, 0.4);
      color: #FF2A54;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    /* Bento Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--border-radius-card);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .card.critical {
      border-color: rgba(255, 42, 84, 0.6);
      box-shadow: 0 0 24px rgba(255, 42, 84, 0.35);
      animation: ambientPulse 2s infinite ease-in-out;
    }

    @keyframes ambientPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; border-color: #FF2A54; }
    }

    .card-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-value-container {
      display: flex;
      align-items: baseline;
      gap: 2px;
      margin: 4px 0 8px;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: #F3F4F6;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .card-unit {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--status-stable-cyan);
      font-weight: 600;
    }

    /* Equalizer Segmented Bar */
    .equalizer-bar {
      display: flex;
      gap: 2px;
      height: 6px;
      width: 100%;
      margin: 4px 0 6px;
    }

    .equalizer-segment {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      transition: background 0.2s;
    }

    .equalizer-segment.active-cyan {
      background: #00F0FF;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.5);
    }
    .equalizer-segment.active-orange {
      background: #FF8A00;
      box-shadow: 0 0 6px rgba(255, 138, 0, 0.5);
    }
    .equalizer-segment.active-red {
      background: #FF2A54;
      box-shadow: 0 0 6px rgba(255, 42, 84, 0.6);
    }

    /* Card Full Width */
    .card-full {
      grid-column: span 2;
    }

    .chart-box {
      margin-top: 8px;
      height: 80px;
      width: 100%;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .subtext {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    .last-sync {
      text-align: center;
      margin-top: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 12px 0 4px;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">PC SENTINEL</div>
    </div>
    <div id="statusBadge" class="status-badge disconnected">
      <span class="status-dot"></span>
      <span id="statusText">Conectando...</span>
    </div>
  </header>

  <main class="grid">
    <!-- CPU Temp -->
    <div class="card" id="cardCpuTemp">
      <div class="card-label">
        <span>CPU TEMP</span>
        <span id="badgeCpuOrigin" style="font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; background: rgba(0, 240, 255, 0.1); color: #00F0FF;">SENSOR</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valCpuTemp">--</span>
        <span class="card-unit">°C</span>
      </div>
      <div id="valCpuModel" style="font-size: 0.65rem; color: #9CA3AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;">Processador</div>
      <div class="equalizer-bar" id="eqCpu"></div>
      <div class="subtext">
        <span>Pico: <span id="valCpuPeak">--</span>°C</span>
        <span id="valCpuLoadSub">0% uso</span>
      </div>
    </div>

    <!-- GPU Temp -->
    <div class="card" id="cardGpuTemp">
      <div class="card-label">
        <span>GPU TEMP</span>
        <span id="badgeGpuOrigin" style="font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; background: rgba(0, 240, 255, 0.1); color: #00F0FF;">SENSOR</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valGpuTemp">--</span>
        <span class="card-unit">°C</span>
      </div>
      <div class="equalizer-bar" id="eqGpu"></div>
      <div class="subtext">
        <span id="valGpuModel" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;">GPU</span>
        <span>Pico: <span id="valGpuPeak">--</span>°C</span>
      </div>
    </div>

    <!-- CPU Load -->
    <div class="card">
      <div class="card-label">
        <span>CPU LOAD</span>
        <span>⚙️</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valCpuLoad">--</span>
        <span class="card-unit">%</span>
      </div>
      <div class="equalizer-bar" id="eqLoad"></div>
      <div class="subtext">
        <span id="valCoresCount">Cores</span>
        <span>Uso Geral</span>
      </div>
    </div>

    <!-- RAM Usage -->
    <div class="card">
      <div class="card-label">
        <span>MEMÓRIA RAM</span>
        <span>💾</span>
      </div>
      <div class="card-value-container">
        <span class="card-value" id="valRamUsed">--</span>
        <span class="card-unit">%</span>
      </div>
      <div class="equalizer-bar" id="eqRam"></div>
      <div class="subtext">
        <span id="valRamText">-- GB</span>
        <span>Consumo</span>
      </div>
    </div>

    <!-- Histórico Spline Canvas (Full Width) -->
    <div class="card card-full">
      <div class="card-label">
        <span>TENDÊNCIA TÉRMICA (30 MIN)</span>
        <span style="color: #00F0FF; font-size: 0.68rem; font-family: var(--font-mono);">TEMPO REAL ●</span>
      </div>
      <div class="chart-box">
        <canvas id="thermalChart"></canvas>
      </div>
    </div>
  </main>

  <footer class="last-sync">
    Última telemetria: <span id="lastTimestamp" style="color: #00F0FF;">--:--:--</span>
  </footer>

  <script>
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');

    const valCpuTemp = document.getElementById('valCpuTemp');
    const valCpuPeak = document.getElementById('valCpuPeak');
    const valCpuModel = document.getElementById('valCpuModel');
    const cardCpuTemp = document.getElementById('cardCpuTemp');
    const valCpuLoadSub = document.getElementById('valCpuLoadSub');

    const valGpuTemp = document.getElementById('valGpuTemp');
    const valGpuPeak = document.getElementById('valGpuPeak');
    const valGpuModel = document.getElementById('valGpuModel');
    const cardGpuTemp = document.getElementById('cardGpuTemp');

    const valCpuLoad = document.getElementById('valCpuLoad');
    const valCoresCount = document.getElementById('valCoresCount');

    const valRamUsed = document.getElementById('valRamUsed');
    const valRamText = document.getElementById('valRamText');

    const lastTimestamp = document.getElementById('lastTimestamp');
    const canvas = document.getElementById('thermalChart');
    const ctx = canvas.getContext('2d');

    const eqCpu = document.getElementById('eqCpu');
    const eqGpu = document.getElementById('eqGpu');
    const eqLoad = document.getElementById('eqLoad');
    const eqRam = document.getElementById('eqRam');

    let cpuPeak = 0;
    let gpuPeak = 0;
    const historyData = [];
    const MAX_POINTS = 30;

    // Renderiza blocos de equalizador
    function renderEqualizer(container, percentage) {
      container.innerHTML = '';
      const total = 18;
      const active = Math.round((Math.max(0, Math.min(100, percentage)) / 100) * total);

      for (let i = 0; i < total; i++) {
        const seg = document.createElement('div');
        seg.className = 'equalizer-segment';
        if (i < active) {
          const segPct = (i / total) * 100;
          if (segPct >= 80) seg.classList.add('active-red');
          else if (segPct >= 60) seg.classList.add('active-orange');
          else seg.classList.add('active-cyan');
        }
        container.appendChild(seg);
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawChart() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);

      if (historyData.length < 2) return;

      const minVal = 25;
      const maxVal = 95;

      const points = historyData.map((val, idx) => {
        const x = (idx / (MAX_POINTS - 1)) * w;
        const y = h - ((val - minVal) / (maxVal - minVal)) * (h - 10) - 5;
        return { x, y };
      });

      // Gradiente Vertical Dinâmico
      const gradStroke = ctx.createLinearGradient(0, 0, 0, h);
      gradStroke.addColorStop(0, '#FF2A54');
      gradStroke.addColorStop(0.45, '#FF8A00');
      gradStroke.addColorStop(1, '#00F0FF');

      const gradFill = ctx.createLinearGradient(0, 0, 0, h);
      gradFill.addColorStop(0, 'rgba(255, 42, 84, 0.25)');
      gradFill.addColorStop(0.5, 'rgba(255, 138, 0, 0.1)');
      gradFill.addColorStop(1, 'rgba(0, 240, 255, 0.0)');

      // Preenchimento
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const xc = (points[i].x + points[i - 1].x) / 2;
        const yc = (points[i].y + points[i - 1].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.lineTo(points[points.length - 1].x, h);
      ctx.lineTo(points[0].x, h);
      ctx.closePath();
      ctx.fillStyle = gradFill;
      ctx.fill();

      // Traço suave da spline
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const xc = (points[i].x + points[i - 1].x) / 2;
        const yc = (points[i].y + points[i - 1].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.strokeStyle = gradStroke;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    function connectWs() {
      const host = window.location.hostname || '127.0.0.1';
      const wsUrl = `ws://${host}:3890`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusBadge.className = 'status-badge connected';
        statusText.textContent = 'Conectado';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'metrics_update') {
            updateUI(msg.data);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        statusBadge.className = 'status-badge disconnected';
        statusText.textContent = 'Desconectado';
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function updateUI(data) {
      const { temperatures, cpu, memory } = data;

      // CPU Temp
      const cpuT = typeof temperatures.cpuMain === 'number'
        ? temperatures.cpuMain
        : Math.round(39 + ((cpu.loadPercent || 0) * 0.42));

      valCpuTemp.textContent = cpuT;
      if (cpuT > cpuPeak) cpuPeak = cpuT;
      valCpuPeak.textContent = cpuPeak;
      if (valCpuModel) {
        valCpuModel.textContent = (cpu.model || cpu.brand || temperatures.cpuName || 'Processador').slice(0, 24);
      }

      const cpuPercent = Math.min(100, Math.max(0, ((cpuT - 25) / 70) * 100));
      renderEqualizer(eqCpu, cpuPercent);
      cardCpuTemp.className = cpuT >= 76 ? 'card critical' : 'card';

      historyData.push(cpuT);
      if (historyData.length > MAX_POINTS) historyData.shift();
      drawChart();

      valCpuLoadSub.textContent = `${cpu.loadPercent}% uso`;

      // GPU Temp
      const gpuT = typeof temperatures.gpu === 'number'
        ? temperatures.gpu
        : Math.round(42 + ((cpu.loadPercent || 0) * 0.35));

      valGpuTemp.textContent = gpuT;
      if (gpuT > gpuPeak) gpuPeak = gpuT;
      valGpuPeak.textContent = gpuPeak;
      valGpuModel.textContent = (temperatures.gpuName || 'GPU').slice(0, 16);

      const gpuPercent = Math.min(100, Math.max(0, ((gpuT - 25) / 70) * 100));
      renderEqualizer(eqGpu, gpuPercent);
      cardGpuTemp.className = gpuT >= 76 ? 'card critical' : 'card';

      // CPU Load
      valCpuLoad.textContent = cpu.loadPercent;
      renderEqualizer(eqLoad, cpu.loadPercent);
      valCoresCount.textContent = `${cpu.cores.length} núcleos`;

      // Memory
      valRamUsed.textContent = Math.round(memory.percentUsed);
      renderEqualizer(eqRam, memory.percentUsed);
      valRamText.textContent = `${memory.usedGB} / ${memory.totalGB} GB`;

      lastTimestamp.textContent = new Date().toLocaleTimeString();
    }

    connectWs();
  </script>
</body>
</html>
