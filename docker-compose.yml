services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pc-sentinel-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcsentinel_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pcsentinel}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pcsentinel} -d ${POSTGRES_DB:-pcsentinel}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
